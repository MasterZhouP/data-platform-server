# 项目相关配置
ruoyi:
  # 名称
  name: RuoYi
  # 版本
  version: 3.9.2
  # 版权年份
  copyrightYear: 2026
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  profile: D:/ruoyi/uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8081
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.ruoyi: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  data:
    # redis 配置
    redis:
      # 地址
      host: localhost
      # 端口，默认为6379
      port: 6379
      # 数据库索引
      database: 0
      # 密码
      password:
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: abcdefghijklmnopqrstuvwxyz
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Springdoc配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '测试模块'
      paths-to-match: '/**'
      packages-to-scan: com.ruoyi.web.controller.tool

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1,ruoyi.vip,www.ruoyi.vip

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

# 集成执行与外部数据源。外部连接默认关闭，凭据只从环境变量注入。
integration:
  configuration:
      oa-rest:
          allowed-hosts:
            - 221.215.114.30
      encryption:
        active-key-id: local-v1
        keys:
          local-v1: guCtYUnok6OAS11h/odqdICH25PcCUWWoewq6mnaco0=
      u8-gateway:
        allowed-hosts: api.yonyouup.com
  oa:
    base-url: ${INTEGRATION_OA_BASE_URL:http://221.215.114.30:8081}
    username: ${INTEGRATION_OA_REST_USERNAME:rest}
    password: ${INTEGRATION_OA_REST_PASSWORD:}
    login-name: ${INTEGRATION_OA_LOGIN_NAME:bladmin}
    connect-timeout-millis: ${INTEGRATION_OA_CONNECT_TIMEOUT_MS:5000}
    read-timeout-millis: ${INTEGRATION_OA_READ_TIMEOUT_MS:15000}
  sync:
    sales-outbound:
      template-code: ${INTEGRATION_SALES_OUTBOUND_TEMPLATE:XSCKDCS}
      main-table: ${INTEGRATION_SALES_OUTBOUND_MAIN_TABLE:formmain_0688}
      detail-table: ${INTEGRATION_SALES_OUTBOUND_DETAIL_TABLE:formson_0689}
      minimum-document-date: ${INTEGRATION_SALES_OUTBOUND_MIN_DATE:2023-09-21}
      # 首次启用定时任务前必须明确设置，例如 2026-09-13T00:00:00。
      initial-cursor: ${INTEGRATION_SALES_OUTBOUND_INITIAL_CURSOR:}
      # 为覆盖晚提交事务，重叠扫描最近24小时；事件账本保证同一增量不会重复执行。
      overlap-minutes: ${INTEGRATION_SALES_OUTBOUND_OVERLAP_MINUTES:1440}
  reference:
    api:
      # OA 插件与平台当前同包、同服务器部署，X-Integration-Key 鉴权暂时禁用。
      # 后续拆分部署时恢复以下服务身份配置，并生成至少 32 字符的随机密钥。
      # clients:
      #   - client-id: oa-plugin-test
      #     enabled: ${INTEGRATION_REFERENCE_API_ENABLED:false}
      #     key: ${INTEGRATION_REFERENCE_API_KEY:}
      #     task-codes:
      #       - U8_MATERIAL_REFERENCE
  execution:
    payload-max-length: 65535
    error-max-length: 2000
    scan-delay-ms: 5000
    scan-limit: 100
    stale-running-ms: 600000
    executor:
      core-pool-size: 2
      max-pool-size: 4
      queue-capacity: 200
  datasource:
    oa:
      enabled: true
      url: jdbc:sqlserver://ae6qe7258136.vicp.fun:35799;databaseName=A810;encrypt=true;trustServerCertificate=true
      username: sa
      password: 123456Abc
      read-only: true
      maximum-pool-size: 3
      connection-timeout: 5000
    u8:
      enabled: true
      url: jdbc:sqlserver://ae6qe7258136.vicp.fun:35799;databaseName=UFDATA_123_2023;encrypt=true;trustServerCertificate=true
      username: sa
      password: 123456Abc
